[package]
name = "wasm-mesher"
version = "0.1.0"
edition = "2021"
authors = ["BlockViewer"]
description = "High-performance Minecraft chunk meshing in WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.92"
js-sys = "0.3.69"

# NBT parsing and decompression for unified WASM pipeline
fastnbt = "2.4"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }

# Web APIs for logging
web-sys = { version = "0.3", features = ["console"] }

# The `console_error_panic_hook` crate provides better debugging of panics
console_error_panic_hook = { version = "0.1.7", optional = true }

# Use `wee_alloc` as the global allocator for smaller code size
wee_alloc = { version = "0.4.5", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.42"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true

