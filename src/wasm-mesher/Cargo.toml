[package]
name = "wasm-mesher"
version = "0.1.0"
edition = "2021"
authors = ["BlockViewer"]
description = "High-performance Minecraft chunk meshing in WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
# Parallel meshing with Rayon (requires SharedArrayBuffer and atomics)
parallel = ["wasm-bindgen-rayon", "rayon"]

[dependencies]
wasm-bindgen = "0.2.92"
js-sys = "0.3.69"
wasm-bindgen-futures = "0.4"

# Fast hash for state string lookups
fnv = "1.0"

# NBT parsing and decompression for unified WASM pipeline
fastnbt = "2.4"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }

# Web APIs for logging
web-sys = { version = "0.3", features = ["console"] }

# The `console_error_panic_hook` crate provides better debugging of panics
console_error_panic_hook = { version = "0.1.7", optional = true }

# Use `wee_alloc` as the global allocator for smaller code size
wee_alloc = { version = "0.4.5", optional = true }

# Parallel processing with Rayon (optional)
rayon = { version = "1.10", optional = true }
wasm-bindgen-rayon = { version = "1.2", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.42"

[profile.release]
# Optimize for speed over size for meshing performance
opt-level = 3
lto = true

# Enable SIMD for WASM target
[target.'cfg(target_arch = "wasm32")'.rustflags]
simd128 = true

